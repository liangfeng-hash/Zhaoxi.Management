name: 部署到本机

on:
  push:
    branches: [ main ]
    # 只有这些路径变了才触发，改 README 不会触发发布
    paths:
      - 'Zhaoxi.Manage.**'
      - 'Zhaoxi.Management.sln'
      - '.github/workflows/**'
  workflow_dispatch:      # 保留手动触发，排障时有用

# 同一时间只允许一个发布流程，避免两次发布互相踩
concurrency:
  group: deploy-local-management
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

  # ⚠️ 关掉 git 的 fsmonitor 守护进程，否则 checkout 收尾时报 EBUSY。
  # Git for Windows 的系统级 gitconfig 默认 core.fsmonitor=true，每次 git 操作都会拉起一个
  # `git fsmonitor--daemon run --detach` 常驻进程；它继承 checkout 临时设置的
  # HOME=_work\_temp\<guid>，导致 checkout 删该目录时句柄未释放 → EBUSY。
  # GIT_CONFIG_* 环境变量优先级高于所有配置文件，且会传递给每个 git 子进程。
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: 'core.fsmonitor'
  GIT_CONFIG_VALUE_0: 'false'
  
  MENTAPI_SITE:   'C:\inetpub\zhaoxiAPI'
  MENTAPI_POOL:   'zhaoxiAPI'
  MENTAPI_HEALTH: 'http://localhost:8000/health'

  IDENTITY_SITE:  'C:\inetpub\IdentityApi'
  IDENTITY_POOL:  'IdentityApi'
  IDENTITY_PORT:  '8001'

  BACKUP_ROOT:    'C:\deploy-backup'

jobs:
  build:
    # 靠 label 找机器：self-hosted + windows 是自带的，local 是你配 runner 时填的
    runs-on: [self-hosted, windows, local]
    environment: local          # 决定读哪一套 Environment Secrets

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 环境自检
        shell: pwsh
        run: |
          Write-Host "主机名: $env:COMPUTERNAME"
          Write-Host "工作目录: $PWD"
          Write-Host "`n--- SDK ---"
          dotnet --list-sdks
          Write-Host "`n--- 代码拉下来了吗 ---"
          Get-ChildItem -Name | Select-Object -First 15

      - name: 还原依赖
        shell: pwsh
        run: dotnet restore Zhaoxi.Management.sln

      - name: 构建 MentApi
        shell: pwsh
        run: |
          dotnet publish Zhaoxi.Manage.MentApi\Zhaoxi.Manage.MentApi.csproj `
            -c Release --no-restore -o "$env:RUNNER_TEMP\publish\mentapi"

      - name: 构建 IdentityApi
        shell: pwsh
        run: |
          dotnet publish Zhaoxi.Manage.IdentityApi\Zhaoxi.Manage.IdentityApi.csproj `
            -c Release --no-restore -o "$env:RUNNER_TEMP\publish\identityapi"

      - name: 检查产物
        shell: pwsh
        run: |
          Write-Host "--- MentApi 产物 ---"
          Get-ChildItem "$env:RUNNER_TEMP\publish\mentapi" -Name | Select-Object -First 20
          Write-Host "`n--- 确认 appsettings.json 是占位符版 ---"
          Get-Content "$env:RUNNER_TEMP\publish\mentapi\appsettings.json" | Select-String "REPLACE_ME"
      # ---------- 单元测试 ----------
      # 位置很关键：在「动站点」之前。测试挂了就中止，生产环境一个字节都不会变 ——
      # 跟阶段 3「先只构建不发布」是同一个道理。
      - name: 单元测试
        shell: pwsh
        run: |
          dotnet test Zhaoxi.Manage.Tests\Zhaoxi.Manage.Tests.csproj `
            -c Release --no-restore --nologo `
            --logger "console;verbosity=minimal"

      # ---------- 渲染生产配置 ----------
      # 位置：构建/测试之后、备份之前。渲染失败就中止，此时站点还没被碰过。
      # 配置的真相来源是 GitHub Environment Secrets，站点上的文件每次发布重新生成。
      - name: 渲染生产配置
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_SECURITY_KEY:     ${{ secrets.JWT_SECURITY_KEY }}
          SMTP_FROM_ADDR:       ${{ secrets.SMTP_FROM_ADDR }}
          SMTP_FROM_PASS:       ${{ secrets.SMTP_FROM_PASS }}
          SMTP_TO_ADDR:         ${{ secrets.SMTP_TO_ADDR }}
          ADMIN_INIT_PASSWORD:  ${{ secrets.ADMIN_INIT_PASSWORD }}
          JWT_ISSUER:           ${{ vars.JWT_ISSUER }}
          JWT_AUDIENCE:         ${{ vars.JWT_AUDIENCE }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 缺哪个要当场说清楚，别等应用起不来才猜
          foreach ($n in 'DB_CONNECTION_STRING','JWT_SECURITY_KEY','SMTP_FROM_ADDR',
                         'SMTP_FROM_PASS','SMTP_TO_ADDR','ADMIN_INIT_PASSWORD',
                         'JWT_ISSUER','JWT_AUDIENCE') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))) {
              Write-Error "缺少 secret/variable: $n（去仓库 Settings - Environments 里配）"; exit 1
            }
          }

          # 两个 API 共用同一个 $jwt 对象，从源头保证密钥一致
          $jwt = @{ Audience = $env:JWT_AUDIENCE; Issuer = $env:JWT_ISSUER; SecurityKey = $env:JWT_SECURITY_KEY }

          # 只写需要被生产值覆盖的 key，其余走 appsettings.json 的分层合并
          $mentApi = @{
            SmtpClientConfig  = @{ FromAddr     = $env:SMTP_FROM_ADDR
                                   FromAddrPass = $env:SMTP_FROM_PASS
                                   ToAddrList   = @($env:SMTP_TO_ADDR) }
            Admin             = @{ password = $env:ADMIN_INIT_PASSWORD }
            ConnectionStrings = @{ ConnectionString = $env:DB_CONNECTION_STRING }
            JWTTokenOptions   = $jwt
          }
          $identityApi = @{
            ConnectionStrings = @{ ConnectionString = $env:DB_CONNECTION_STRING }
            JWTTokenOptions   = $jwt
          }

          $targets = @(
            @{ Obj = $mentApi;     Out = "$env:RUNNER_TEMP\publish\mentapi\appsettings.Production.json" },
            @{ Obj = $identityApi; Out = "$env:RUNNER_TEMP\publish\identityapi\appsettings.Production.json" }
          )
          foreach ($t in $targets) {
            # ConvertTo-Json 自动处理转义，连接串里的 \ 和 " 不用自己操心
            $json = $t.Obj | ConvertTo-Json -Depth 10
            [System.IO.File]::WriteAllText($t.Out, $json, (New-Object System.Text.UTF8Encoding $false))
            Write-Host "  渲染 -> $($t.Out)"
          }

          # 业务级校验：两个 API 的 JWT 密钥必须一致，否则登录后随机 401
          $a = (Get-Content $targets[0].Out -Raw -Encoding UTF8 | ConvertFrom-Json).JWTTokenOptions.SecurityKey
          $b = (Get-Content $targets[1].Out -Raw -Encoding UTF8 | ConvertFrom-Json).JWTTokenOptions.SecurityKey
          if ($a -ne $b) { Write-Error "两个 API 的 JWT SecurityKey 不一致"; exit 1 }
          Write-Host "  JWT 密钥一致性校验通过"

      - name: 备份当前站点
        shell: pwsh
        run: |
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          foreach ($pair in @(
              @{ Src = $env:MENTAPI_SITE;  Name = 'mentapi'  },
              @{ Src = $env:IDENTITY_SITE; Name = 'identityapi' })) {

            $dest = Join-Path $env:BACKUP_ROOT "$($pair.Name)\$stamp"
            Write-Host "备份 $($pair.Src) -> $dest"
            robocopy $pair.Src $dest /E /XD logs FileUpload /NFL /NDL /NJH /NJS /R:2 /W:1 | Out-Null

            # robocopy 退出码 <8 都算成功，必须手动判断
            if ($LASTEXITCODE -ge 8) { Write-Error "备份失败 code=$LASTEXITCODE"; exit 1 }

            # 只保留最近 5 份
            $keepRoot = Join-Path $env:BACKUP_ROOT $pair.Name
            Get-ChildItem $keepRoot -Directory | Sort-Object Name -Descending |
              Select-Object -Skip 5 | Remove-Item -Recurse -Force
          }
          exit 0

      # ---------- 停服务 ----------
      - name: 放置 app_offline.htm
        shell: pwsh
        run: |
          $html = '<html><head><meta charset="utf-8"></head><body><h2>正在部署，请稍候…</h2></body></html>'
          foreach ($site in @($env:MENTAPI_SITE, $env:IDENTITY_SITE)) {
            $html | Set-Content -Path (Join-Path $site 'app_offline.htm') -Encoding UTF8
          }
          # 给 ASP.NET Core Module 时间优雅退出并释放文件锁
          Start-Sleep -Seconds 5

      # ---------- 同步产物 ----------
      - name: 同步 MentApi
        shell: pwsh
        run: |
          robocopy "$env:RUNNER_TEMP\publish\mentapi" $env:MENTAPI_SITE /MIR `
            /XF appsettings.Development.json app_offline.htm `
            /XD logs log4 FileUpload `
            /NFL /NDL /NJH /NJS /R:3 /W:2
          if ($LASTEXITCODE -ge 8) { Write-Error "同步失败 code=$LASTEXITCODE"; exit 1 }
          exit 0

      - name: 同步 IdentityApi
        shell: pwsh
        run: |
          robocopy "$env:RUNNER_TEMP\publish\identityapi" $env:IDENTITY_SITE /MIR `
            /XF appsettings.Development.json app_offline.htm `
            /XD logs log4 `
            /NFL /NDL /NJH /NJS /R:3 /W:2
          if ($LASTEXITCODE -ge 8) { Write-Error "同步失败 code=$LASTEXITCODE"; exit 1 }
          exit 0

      # ---------- 起服务 ----------
      # if: always() —— 就算前面失败也要恢复站点，不能让它一直挂着维护页
      - name: 移除 app_offline.htm
        if: always()
        shell: pwsh
        run: |
          foreach ($site in @($env:MENTAPI_SITE, $env:IDENTITY_SITE)) {
            Remove-Item (Join-Path $site 'app_offline.htm') -Force -ErrorAction SilentlyContinue
          }

      - name: 回收应用池
        shell: pwsh
        run: |
          $appcmd = "$env:SystemRoot\System32\inetsrv\appcmd.exe"
          foreach ($pool in @($env:MENTAPI_POOL, $env:IDENTITY_POOL)) {
            & $appcmd recycle apppool /apppool.name:"$pool"
            Write-Host "$pool 已回收"
          }

      # ---------- 验证 ----------
      - name: 健康检查
        shell: pwsh
        run: |
          # MentApi 有 /health 端点（Program.cs 里 MapHealthChecks），直接探
          $ok = $false
          for ($i = 1; $i -le 12; $i++) {
            try {
              $r = Invoke-WebRequest $env:MENTAPI_HEALTH -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Write-Host "第 $i 次探测未通过，3 秒后重试…"
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { Write-Error "MentApi 健康检查失败"; exit 1 }
          Write-Host "MentApi /health 通过"

          # IdentityApi 没有 /health 端点，退而求其次探端口
          $tcp = Test-NetConnection -ComputerName localhost -Port ([int]$env:IDENTITY_PORT) -WarningAction SilentlyContinue
          if (-not $tcp.TcpTestSucceeded) { Write-Error "IdentityApi 端口不通"; exit 1 }
          Write-Host "IdentityApi 端口 $env:IDENTITY_PORT 可连接"

      # ---------- 冒烟测试 ----------
      # 健康检查只能证明「进程活着」，冒烟测试证明「业务是通的」。
      # 直连两个 API（不经网关），只验证本仓库发布的东西。
      - name: 冒烟测试（登录 → 带 token 查业务数据）
        shell: pwsh
        env:
          SMOKE_USER: ${{ vars.SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.SMOKE_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SMOKE_USER) -or [string]::IsNullOrWhiteSpace($env:SMOKE_PASS)) {
            Write-Error "缺少 SMOKE_USER / SMOKE_PASS，去仓库 Settings 配一下（见手册 4.5）"; exit 1
          }

          # ① 登录 —— 直连 IdentityApi
          $body  = @{ Name = $env:SMOKE_USER; Password = $env:SMOKE_PASS } | ConvertTo-Json
          $login = Invoke-RestMethod "http://localhost:$($env:IDENTITY_PORT)/auth/Account" `
                     -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 20
          if (-not $login.success) { Write-Error "① 登录失败: $($login.message)"; exit 1 }

          $token = $login.oValue.accesstoken
          if ([string]::IsNullOrWhiteSpace($token)) { Write-Error "① 登录成功却没拿到 token"; exit 1 }
          Write-Host "① 登录通过（用户 $($login.data.userName)，token 长度 $($token.Length)）"

          # ② 带 token 查业务数据 —— 直连 MentApi
          #    这一步同时验证了两个 API 的 JWT SecurityKey 一致：
          #    IdentityApi 签发的 token，MentApi 必须能验通，否则就是那个「随机 401」的根因
          $menus = Invoke-RestMethod "http://localhost:8000/api/Menu/1/10" `
                     -Headers @{ Authorization = "Bearer $token" } -TimeoutSec 20
          if (-not $menus.success) { Write-Error "② 业务查询失败: $($menus.message)"; exit 1 }
          Write-Host "② 业务查询通过（$($menus.message)）"

          # ③ 反向验证：不带 token 必须被拒。防止哪次改动把鉴权关掉了还没人发现。
          #    ⚠️ 本项目是「HTTP 200 + body 业务码」风格：鉴权失败也返回 HTTP 200，
          #    真实结果在 success / oValue 里。所以必须判 body，不能靠 catch HTTP 异常。
          $anon = Invoke-RestMethod "http://localhost:8000/api/Menu/1/10" -TimeoutSec 15
          if ($anon.success) { Write-Error "③ 无 token 竟能拿到数据 —— 鉴权失效"; exit 1 }
          Write-Host "③ 无 token 被正确拒绝（业务码 $($anon.oValue)）"

          Write-Host "`n冒烟测试全部通过：登录链路 / JWT 密钥一致性 / 鉴权拦截"