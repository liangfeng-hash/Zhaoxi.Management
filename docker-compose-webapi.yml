services:
  zhaoxi.manage.mentapi:
    image: zhaoximanagementapi_test
    build:
      context: ./Zhaoxi.Management
      dockerfile: Zhaoxi.Manage.MentApi/Dockerfile
    container_name: container_webapi
    ports:
      - 8007:80
    volumes:
      - "./config_webapi/appsettings.json:/app/appsettings.json"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: always
