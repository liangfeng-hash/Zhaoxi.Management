services:
  webapi:
    image: zhaoxi-webapi
    build:
      context: ./webapi
      dockerfile: Dockerfile
    container_name: zhaoxi-webapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - "./config_webapi/appsettings.json:/app/appsettings.json:ro"
      - "./uploads:/app/FileUpload"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Asia/Shanghai
    mem_limit: 512m
    networks:
      - zhaoxi-net

  auth:
    image: zhaoxi-auth
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: zhaoxi-auth
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - "./config_auth/appsettings.json:/app/appsettings.json:ro"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Asia/Shanghai
    mem_limit: 512m
    networks:
      - zhaoxi-net

networks:
  zhaoxi-net:
    external: true      # 用步骤 0 建好的网络，不由 compose 创建